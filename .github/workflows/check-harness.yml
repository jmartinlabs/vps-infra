name: Check agent adapters

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_harness.py
      - run: ./scripts/validate-template
      - run: ./scripts/test-validator
      - run: ./scripts/test-release-gate
      - run: ./scripts/test-datasette-admin
      - run: bash -n scripts/phase2a-host-test.sh
      - run: bash -n scripts/phase2a-postcheck-test.sh
      - run: python3 -m pip install --disable-pip-version-check --quiet 'datasette==1.0a41'
      - run: ./scripts/test-datasette-admin-integration
      - run: python3 scripts/eval-agent-behavior --self-test
      - run: python3 scripts/test-agent-usage
      - run: python3 scripts/test-auto-agent-usage
      - run: python3 scripts/test-agent-relay
      - run: npm install --no-save --no-package-lock --ignore-scripts mermaid@11.12.1 jsdom@26.1.0
      - run: node scripts/check-mermaid.mjs docs/GUIA_VISUAL_ORQUESTACION.md
      - name: Prove malformed Mermaid is rejected
        run: |
          set -eu
          cat > "$RUNNER_TEMP/invalid-mermaid.md" <<'EOF'
          ```mermaid
          flowchart TD
            A -->|broken B
          ```
          EOF
          if node scripts/check-mermaid.mjs "$RUNNER_TEMP/invalid-mermaid.md"; then
            echo 'Malformed Mermaid was incorrectly accepted'
            exit 1
          fi
      - run: git diff --check
